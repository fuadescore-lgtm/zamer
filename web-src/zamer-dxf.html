<title>EasyCAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: full-bleed drafting sheet between a slim top bar and a thumb-reach tool rail; tape-measure yellow marks live readouts and export */
:root{
  --paper:#f4f6f4; --surface:#ffffff; --ink:#1b2024; --muted:#646d6a; --rule:#d6dbd7;
  --grid:#e5e9e5; --grid2:#cfd6d0;
  --wall:#c9d0cb; --tape:#f0b90b; --tape-ink:#1d1907; --dim:#c0392b; --ok:#2e8b57; --open:#1d6f8c; --sel:#2563eb;
  --shadow:rgb(20 30 25 / .14);
  --f-ui:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121517; --surface:#1b1f22; --ink:#e6eae7; --muted:#97a19c; --rule:#2c3337;
    --grid:#1b2023; --grid2:#283035; --wall:#37403f; --tape:#f5c518; --tape-ink:#1a1606; --dim:#ff7b63; --ok:#5fd18f; --open:#5cc3e0; --sel:#6ea8ff;
    --shadow:rgb(0 0 0 / .5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121517; --surface:#1b1f22; --ink:#e6eae7; --muted:#97a19c; --rule:#2c3337;
  --grid:#1b2023; --grid2:#283035; --wall:#37403f; --tape:#f5c518; --tape-ink:#1a1606; --dim:#ff7b63; --ok:#5fd18f; --open:#5cc3e0; --sel:#6ea8ff;
  --shadow:rgb(0 0 0 / .5); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

.top{display:flex;align-items:center;gap:4px;padding-block:8px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--rule)}
.ib{width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;border-radius:8px;background:none}
.ib:hover{background:var(--grid)}
.ib:disabled{opacity:.35;cursor:default;background:none}
.ib svg{width:22px;height:22px}
#docName{flex:1;min-width:0;height:38px;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink);font-family:var(--f-ui);font-weight:600;font-size:17px;padding:0 6px;text-overflow:ellipsis}
#docName:hover,#docName:focus{border-color:var(--rule);background:var(--paper)}
.num{flex:none;display:flex;align-items:center;gap:2px;height:40px;padding:0 4px 0 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-family:var(--f-num);font-weight:600;color:var(--muted)}
.num:focus-within{border-color:var(--sel)}
#docNum{width:76px;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--f-num);font-weight:600;font-size:16px;padding:0 2px;outline:none}
#fab{position:absolute;top:10px;right:12px;display:flex;flex-direction:column;gap:6px}
.fb{background:var(--surface);border:1px solid var(--rule);box-shadow:0 2px 8px var(--shadow)}
.fb:disabled{background:var(--surface)}
.dyn{position:absolute;z-index:3;display:flex;align-items:center;gap:4px;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 6px 18px var(--shadow);padding:3px;opacity:.96}
.dyn input{height:30px;border:2px solid var(--sel);border-radius:7px;background:var(--surface);color:var(--ink);font-family:var(--f-num);font-weight:600;font-size:15px;text-align:center;padding:0 4px}
.dyn #dynLen{width:78px}.dyn #dynAng{width:50px;border-color:var(--rule)}
.dyn input::placeholder{color:var(--sel);opacity:.75}.dyn #dynAng::placeholder{color:var(--muted)}
.dyn button{width:26px;height:30px;padding:0;border:0;border-radius:7px;background:none;color:var(--ink);font-size:15px}
.dyn .grip{width:18px;color:var(--muted);cursor:grab;touch-action:none;font-size:13px}
.dyn button:active{background:var(--tape)}
.dyn .ok{background:var(--tape);color:#111;font-weight:700;width:30px}
.inline{position:absolute;z-index:3;width:110px;height:40px;transform:translate(-50%,-50%);border:2px solid var(--sel);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--f-num);font-weight:600;font-size:18px;text-align:center;box-shadow:0 6px 18px var(--shadow);padding:0 6px}
.export{position:relative;height:40px;flex:none;display:grid;place-items:center;min-width:46px;padding:0 12px 4px;border:0;border-radius:8px;background:var(--tape);color:var(--tape-ink);font-family:var(--f-ui);font-weight:700;font-size:17px;letter-spacing:.06em;overflow:hidden}
.export::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 5px),repeating-linear-gradient(90deg,var(--tape-ink) 0 1.5px,transparent 1.5px 25px);
  background-size:auto 3px,auto 6px;background-repeat:repeat-x;background-position:0 100%,0 100%;opacity:.55}

#stage{position:relative;overflow:hidden;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.okb{background:var(--tape)!important;color:#111!important}.cxb{color:var(--dim)!important}
#hud{position:absolute;top:10px;left:16px;right:64px;display:flex;justify-content:flex-start;pointer-events:none}
#hud span{max-width:100%;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--muted);line-height:1.25}
#hud span:empty{display:none}
.nsrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}#nsDial{width:150px;height:150px;touch-action:none;flex:none}.nscol{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
.nsm{display:flex;flex-wrap:wrap;gap:6px}.nslk{display:flex;gap:8px;align-items:center;font-size:14px}.nsdec{display:flex;gap:6px;align-items:center}
#gpMap{position:fixed;inset:0;z-index:62;background:var(--paper);display:flex;flex-direction:column}#gpMap[hidden]{display:none}
#gpMap .gptop{display:flex;gap:6px;align-items:center;padding:8px 10px calc(8px);padding-top:calc(8px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--rule)}#gpMap .gptop .inp{flex:1;min-width:0}
#gpMap .gpres{position:absolute;z-index:3;left:10px;right:10px;top:calc(58px + env(safe-area-inset-top));max-height:50%;overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 20px var(--shadow)}#gpMap .gpres[hidden]{display:none}
#gpMap .gpres .btn{text-align:left;white-space:normal;height:auto;padding:6px 8px;font-size:13px}#gpMap .gpres small{font-size:10.5px;color:var(--muted);padding:2px 4px}
#gpMap .gpwrap{position:relative;flex:1;min-height:0}#gpMap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gpMap .gpattr{position:absolute;right:4px;bottom:4px;font-size:10.5px;background:rgb(255 255 255 / .75);color:#333;padding:1px 5px;border-radius:4px;pointer-events:none}
#gpMap .v3bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--rule)}#gpMap .v3bar .sp{flex:1}
#gpMap [data-g][aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#btnMe[aria-pressed="true"]{color:var(--sel)}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -6px 20px var(--shadow);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;touch-action:manipulation;user-select:none}
#kp[hidden]{display:none}
#kp button{height:46px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);font:600 21px var(--f-num);display:grid;place-items:center}
#kp button:active,#kp button.dn{background:var(--sel);color:#fff;border-color:var(--sel)}
#kp .ok{background:var(--sel);color:#fff;border-color:var(--sel);grid-column:span 2}#kp .z{grid-column:span 2}
#kp .fn{font-size:18px;color:var(--muted)}
.solp{display:grid;gap:8px;margin:8px 0 10px}.solp .btn{text-align:left;height:auto;padding:9px 12px;line-height:1.35;white-space:normal}.solp .btn[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--sel)}.sheet-body .pkrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:6px 0}
#kp .kph{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;padding:0 4px 2px;min-height:22px;font:600 14px/1.3 system-ui,sans-serif;color:var(--muted);overflow:hidden;white-space:nowrap}#kp .kph .kpv{margin-left:auto;font:600 17px var(--f-num);color:var(--ink)}
#kp .cx{color:#d64545;font-size:20px}
/* отклик кнопок: лёгкая подсветка при нажатии, без тяжёлых анимаций */
button{-webkit-tap-highlight-color:transparent}
.btn:active,.ibn:active,.ib:active,#toolMenu button:active,.seg button:active,.lv:active,.tb:active,[data-tool]:active{filter:brightness(.88);transform:scale(.97)}
.btn,.ibn,.ib,#toolMenu button,.seg button,[data-tool]{transition:filter .08s,transform .08s,background-color .12s}
#toolMenu button[aria-pressed="true"],.seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--sel)}
#btnDel{color:#fff!important;background:#d64545!important;border-color:#d64545!important}#btnDel[hidden]{display:none}
#hud span.live{background:var(--tape);border-color:transparent;color:var(--tape-ink);font-family:var(--f-num);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;padding:4px 12px}
#toast{position:absolute;bottom:90px;pointer-events:none;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--ink) 86%,transparent);color:var(--paper);padding:5px 12px;border-radius:999px;font-size:13px;box-shadow:0 6px 20px var(--shadow);transition:opacity .2s}
#toast.off{opacity:0;pointer-events:none}

.panel{position:absolute;left:6px;right:6px;bottom:6px;flex-wrap:nowrap!important;align-items:center!important;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;max-height:none!important;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:5px 8px;box-shadow:0 8px 28px var(--shadow);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:flex-end;max-height:40vh;overflow-y:auto}
.panel.two{flex-direction:column;align-items:stretch!important;overflow:hidden}.panel .prow{display:flex;flex-wrap:nowrap;gap:4px 6px;align-items:center;overflow-x:auto;scrollbar-width:none;min-width:0}.panel .prow::-webkit-scrollbar{display:none}.panel .prow>*{flex:none}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label,.lbl{font-family:var(--f-ui);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{height:30px;width:78px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums;padding:0 6px}
.inp.wide{width:min(240px,60vw);font-family:var(--f-body)}
.inp.sm{width:60px}
select.inp{font-family:var(--f-ui);font-size:13px;width:auto;padding-right:6px}
.dirs{display:grid;grid-template-columns:repeat(4,32px);gap:2px}
.dirs button,.btn{height:30px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-family:var(--f-ui);font-weight:600;font-size:13px;letter-spacing:.01em}
.dirs button{font-family:var(--f-num);font-size:15px}
.btn{padding:0 8px}
.btn:hover,.dirs button:hover{border-color:var(--muted)}
.btn.danger{color:var(--dim)}
.btn.go{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sp{flex:1}
.axpick{position:absolute;z-index:2;display:flex;transform:translate(-50%,-100%);background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 6px 18px var(--shadow);overflow:hidden}
.axpick button{min-width:32px;height:28px;border:0;border-left:1px solid var(--rule);background:none;font-family:var(--f-num);font-weight:600;font-size:12.5px;color:var(--ink)}
.axpick .grip{min-width:20px;cursor:grab;color:var(--muted);touch-action:none;font-size:13px}
.axpick button:first-child{border-left:0}
.axpick .axal{font-family:var(--f-ui,inherit);font-size:12px;padding:0 8px;background:var(--tape);color:#111}
.axpick button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink)}
.lvdd{position:relative;flex:none}
@media (max-width:520px){.top{padding-inline:8px;gap:3px}.num{height:36px;padding:0 2px 0 6px}#docNum{width:54px;font-size:14px}.lvbtn{max-width:96px;padding:0 7px;font-size:13px}.lvbtn small{display:none}.export{padding:0 10px 4px;font-size:15px;height:36px}#docName{font-size:15px}}
.lvbtn{height:36px;max-width:132px;display:flex;align-items:center;gap:4px;padding:0 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden}
.lvbtn span{overflow:hidden;text-overflow:ellipsis}.lvbtn small{font-family:var(--f-num);font-weight:500;font-size:10.5px;color:var(--muted)}
.lvmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:6;min-width:180px;display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 28px var(--shadow)}
.lvmenu{min-width:210px;max-width:min(300px,calc(100vw - 24px))}
.lvmenu .lv{display:flex;align-items:center;justify-content:space-between;gap:14px;border-radius:7px;border:0;height:auto;min-height:42px;padding:5px 10px;background:none;color:var(--ink);text-align:left;white-space:nowrap;line-height:1.2}
.lvmenu .lv .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-ui);font-weight:700;font-size:15px}
.lvmenu .lv .lm{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.lvmenu .lv .lm b{font-weight:600;color:inherit}.lvmenu .lv .lm i{font-style:normal;font-size:11px;opacity:.85}
.lvmenu .lv[aria-pressed="true"] .lm{color:var(--paper)}
.lvmenu .lv.cfg .ln{font-weight:500;font-size:14px;color:var(--muted)}
.lvmenu .lv[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lvmenu .lv.cfg{border-top:1px solid var(--rule);border-radius:0 0 7px 7px;color:var(--muted)}
.levels{display:flex;gap:6px;align-items:center;padding-block:6px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.lv{flex:none;display:flex;align-items:baseline;gap:6px;height:34px;padding:0 12px;border:1px solid var(--rule);border-radius:999px;background:var(--paper);font-family:var(--f-ui);font-weight:600;font-size:15px;line-height:32px}
.lv small{font-family:var(--f-num);font-weight:500;font-size:11px;color:var(--muted)}
.lv[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lv[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.lv.cfg{color:var(--muted)}
.only3d{display:none!important}html.is3d .only3d{display:revert!important}
#v3d{position:fixed;inset:0;z-index:60;background:var(--bg,#eee);display:flex;flex-direction:column}#v3d[hidden]{display:none}
#v3d .v3w{position:relative;flex:1;min-height:0}#v3d canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}#v3d .v3hint{position:absolute;left:10px;top:8px;font-size:12.5px;color:#b42318;pointer-events:none}
#v3d .v3p{position:absolute;left:6px;right:6px;bottom:6px;border:1px solid var(--rule,#ccc);border-radius:10px;box-shadow:0 6px 20px var(--shadow,rgba(0,0,0,.2));display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 10px;background:var(--surface,#fff);border-top:1px solid var(--rule,#ccc)}#v3d .v3p[hidden]{display:none}#v3d .v3p .sp{flex:1}#v3d .v3p .inp{width:70px}
#elev{position:fixed;inset:0;z-index:61;background:var(--paper,#f7f7f2);display:flex;flex-direction:column}#elev[hidden]{display:none}
#elev .evwrap{position:relative;flex:1;min-height:0}#elev canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#elev .evo{touch-action:none}
#elev .evin{position:absolute;z-index:3;transform:translate(-50%,-50%);width:96px}
#elev .evhint{position:absolute;left:10px;top:8px;right:70px;font-size:12.5px;color:var(--muted,#475569);pointer-events:none}
#elev .v3bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--surface,#fff);border-top:1px solid var(--line,#ccc)}#elev .v3bar .sp{flex:1}
#elev [data-ev][aria-pressed="true"]{background:var(--ink,#222);color:var(--paper,#fff)}
#v3d .v3bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--surface,#fff);border-top:1px solid var(--line,#ccc)}#v3d .v3bar .sp{flex:1}
.lvrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px auto;gap:8px;align-items:end}
.lvrow .inp{width:100%}
html:not(.is3d) .lvrow{grid-template-columns:minmax(0,1fr) 104px auto}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{height:30px;min-width:34px;padding:0 7px;border:0;border-left:1px solid var(--rule);background:var(--paper);font-family:var(--f-ui);font-weight:600;font-size:12.5px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rows{flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px 8px;align-items:flex-end}
.hint{flex-basis:100%;margin:0;font-size:11.5px;color:var(--muted);line-height:1.35}
.title{flex-basis:100%;display:flex;align-items:baseline;gap:6px;font-family:var(--f-ui);font-weight:600;font-size:13.5px;line-height:1.2}
@media (max-height:820px){.panel .hint{display:none}}
.panel .hint{display:none}.panel .title{font-size:12px;flex:none!important;flex-basis:auto!important;white-space:nowrap}
.panel>*{flex:none}.panel .fld{flex-direction:row;align-items:center;gap:4px}.panel .fld label,.panel .fld .lbl{font-size:10px;letter-spacing:.02em}.panel .rows{display:contents}.panel .inp{width:64px}.panel .inp.wide{width:150px}
.panel .inp{height:30px}
.ibn{width:34px;height:32px;padding:0;display:inline-grid;place-items:center;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.ibn svg{width:20px;height:20px}.ibn.danger{color:var(--dim)}
.panel .fld.inl{flex-direction:row;align-items:center;gap:4px}.panel .fld.inl label{font-size:11px;letter-spacing:0}
.csw{position:relative;display:inline-flex;align-items:center;gap:3px;height:32px;padding:0 6px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);cursor:pointer;flex:none}
.csw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.csw span{width:18px;height:18px;border-radius:4px;border:1px solid var(--muted);background-image:linear-gradient(45deg,transparent 45%,var(--dim) 45%,var(--dim) 55%,transparent 55%)}
.csw i{font-style:normal;font-size:11px;font-family:var(--f-ui);color:var(--muted)}
.panel .inp.xs{width:54px;padding:0 4px}
.panel #pLayer{width:auto;max-width:84px;font-size:12px;padding:0 2px}
.panel{padding:4px 6px!important}
.title b{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}

.tools{min-width:0;display:flex;gap:2px;align-items:center;padding-block:6px;padding-inline:16px;background:var(--surface);border-top:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:6px 4px 5px;border:0;border-radius:10px;background:none;color:var(--muted);font-family:var(--f-ui);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}

$('#btnMenu').addEventListener('click',()=>{ if(!sheet.hidden&&sheet.classList.contains('appm')){ sheet.hidden=true; return; } confirmDel=null;renderSheet('recent');sheet.hidden=false;});
sheet.addEventListener('click',e=>{
  if(e.target===sheet){sheet.hidden=true;return;}
  const b=e.target.closest('[data-s]'); if(!b) return; const id=b.dataset.id;
  switch(b.dataset.s){
    case 'close':sheet.hidden=true;break;

    case 'privacy':{ const u='https://fuadhayat10-boop.github.io/bimsketcher-legal/privacy.html'+(EN?'#en':'#ru'); try{ window.open(u,'_blank'); }catch(e){ location.href=u; } }break;
    case 'save':sheet.hidden=true; saveCurrentFile(); break;
    case 'export':sheet.hidden=true; openExport(); break;
    case 'levels':openLevels(); break;
    case 'lvadd':{ // новый этаж встаёт под крышу: крыша поднимается на высоту этажа
      pushUndo(); const L=doc.levels, top=L[L.length-1], roof=top&&isRoofName(top.name)?top:null, below=roof?L[L.length-2]:top;
      const h=below&&roof?Math.max(2500,roof.elev-below.elev):3000;

      else L.push({id:uid(),name:'Этаж 999',elev:(top?top.elev:0)+3000,items:[]});
      sortLevels(); persist(); renderLevels(); openLevels(); break;}
    case 'lvdel':{const i=+b.dataset.i; if(lvDelConfirm!==i){lvDelConfirm=i;openLevels();break;}
      lvDelConfirm=null; const cur=doc.levels[doc.curLv]; doc.levels.splice(i,1); let ci=doc.levels.indexOf(cur); if(ci<0) ci=Math.max(0,i-1);
      doc.curLv=-1; setLevel(ci); persist(); renderLevels(); openLevels(); break;}
    case 'lvcopy':{const f=+$('#cpFrom').value,t=+$('#cpTo').value; if(f===t){toast('Выберите разные уровни');break;}
      pushUndo(); const n=copyLevel(f,t); if(t>f) liftRoofs(f,t); persist(); sheet.hidden=true; doc.curLv=-1; setLevel(t); toast('Скопировано объектов: '+n+' → '+doc.levels[t].name); break;}
    case 'allW':{pushUndo();let n=0;for(const it of doc.items) if(it.t==='line'&&it.L==='walls'){it.w=doc.settings.wallW;n++;}
      persist();redraw();toast('Толщина изменена у стен: '+n);break;}
    case 'open':openDoc(id);sheet.hidden=true;break;
    case 'new':{ if(!docHasContent()){ createNew(); break; } askNew(); break; }
    case 'newSave':{ b.disabled=true; saveCurrentFile().then(ok=>{ if(ok){ createNew(); toast('Старый чертёж сохранён файлом, создан новый'); } else b.disabled=false; }); break; }
    case 'newNoSave':createNew(); toast('Создан новый чертёж. Старый остался в списке «Чертежи»'); break;
    case 'newCancel':renderSheet(); break;
    case 'del':
      if(confirmDel!==id){confirmDel=id;renderSheet();break;}
      delete store.docs[id]; confirmDel=null;

      renderSheet(); break;
  }
});
sheet.addEventListener('change',e=>{
  const tl=e.target;
  const reLv=()=>setTimeout(()=>{ if(!sheet.hidden&&sheet.querySelector('#lvT')) openLevels(); },0); // перерисовать окно после ухода фокуса
  if(tl.dataset.lname!==undefined){ pushUndo(); doc.levels[+tl.dataset.lname].name=tl.value.trim()||'Уровень'; persist(); renderLevels(); return; }
  if(tl.dataset.lheight!==undefined){ const v=parseNum(tl.value); if(!(v>=100&&v<=30000)){ toast('Не соответствует: высота этажа 100…30000 мм'); reLv(); return; } pushUndo(); if(!fitGuard(()=>setLvHeight(+tl.dataset.lheight,r3(v)))){ reLv(); return; } persist(); renderLevels(); reLv(); redraw(); return; }

  else if(t.id==='sHints'){ setHints(t.checked); return; }
  else if(t.id==='sNatDim') doc.settings.nativeDims=t.checked;
  else if(t.id==='sWallW'){const v=parseNum(t.value); if(v>=0){doc.settings.wallW=v; const b=sheet.querySelector('[data-s="allW"]'); if(b) b.textContent='Задать всем стенам толщину '+fmt(v)+' мм';}}
  else if(t.id==='sClose') doc.settings.closeMode=t.value;
  persist(); redraw();
});

async function b64of(data){ let u8;
  if(data instanceof Blob) u8=new Uint8Array(await data.arrayBuffer());
  else if(typeof data==='string') u8=new TextEncoder().encode(data);
  else u8=data instanceof Uint8Array?data:new Uint8Array(data);
  let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
async function nativeShare(data,fn,title){ const P=window.Capacitor.Plugins;
  const r=await P.Filesystem.writeFile({path:fn,data:await b64of(data),directory:'CACHE'});
  await P.Share.share({title:title||fn,files:[r.uri],dialogTitle:'Отправить '+fn}); }
async function nativeSave(data,fn){ const P=window.Capacitor.Plugins;
  try{ await P.Filesystem.writeFile({path:(IS3D?'BIMsketcher/':(EN?'EasyCAD/':'Замер/'))+fn,data:await b64of(data),directory:'DOCUMENTS',recursive:true}); toast((EN?'Saved: Documents/':'Сохранено: Документы/')+(IS3D?'BIMsketcher/':(EN?'EasyCAD/':'Замер/'))+fn); }

function download(blob,name){
  if(NATIVE){ nativeSave(blob,name); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);

async function tryShare(files,title){
  if(NATIVE&&files.length){ try{ await nativeShare(files[0],files[0].name,title); return 'ok'; }
    catch(e){ return /cancel/i.test(String(e&&e.message||e))?'cancel':'fail'; } }
  if(!navigator.share||!navigator.canShare) return 'no';
  for(const f of files){
    let ok=false; try{ok=navigator.canShare({files:[f]});}catch(e){}
    if(!ok) continue;
    try{ await navigator.share({files:[f],title}); return 'ok'; }
    catch(e){ return e&&e.name==='AbortError'?'cancel':'fail'; }

  return 'no';

function magDecl(lat,lon,yr){ const N=12, dt=yr-2025, a=6378.137, f=1/298.257223563, e2=f*(2-f), re=6371.2, ph=lat*Math.PI/180, la=lon*Math.PI/180, sp=Math.sin(ph);

    for(let m=0;m<=n;m++){

      else if(n===1){ P[n][m]=c*P[0][0]; D[n][m]=c*D[0][0]-s*P[0][0]; }
      else { const K=((n-1)*(n-1)-m*m)/((2*n-1)*(2*n-3)); P[n][m]=c*P[n-1][m]-K*(P[n-2][m]||0); D[n][m]=c*D[n-1][m]-s*P[n-1][m]-K*(D[n-2][m]||0); }
