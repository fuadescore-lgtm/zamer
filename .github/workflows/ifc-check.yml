name: IFC check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ifcopenshell numpy matplotlib
      - run: mkdir -p ifc-out && python tools/ifccheck.py 'tools/ifc-samples/*.ifc' ifc-out 2>&1 | tee ifc-out/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ifc-check
          path: ifc-out
