name: Сборка APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Установка Capacitor
        run: npm install
      - name: Android-проект
        run: |
          npx cap add android
          npx cap sync android
      - name: Значок и ключ подписи
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icons/$d.png android/app/src/main/res/mipmap-$d/$n.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - name: Номер версии
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Сборка
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore/release.jks \
            -Pandroid.injected.signing.store.password=zamer2026 \
            -Pandroid.injected.signing.key.alias=zamer \
            -Pandroid.injected.signing.key.password=zamer2026
          cp app/build/outputs/apk/release/app-release.apk ../EasyCAD.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EasyCAD-apk
          path: EasyCAD.apk
      - name: Выпуск для скачивания
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: EasyCAD 1.${{ github.run_number }}
          files: EasyCAD.apk
