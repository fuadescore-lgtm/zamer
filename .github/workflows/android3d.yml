name: Сборка BIMsketcher (APK + AAB для Google Play)
on:
  push:
    branches: [main]
    paths: ['app3d/**', 'native/**', 'native3d/**', 'keystore/upload.jks.enc', '.github/workflows/android3d.yml']
  workflow_dispatch:
    inputs:
      src_only:
        description: 'Только исходники Android-проекта (без пересборки APK/AAB)'
        type: boolean
        default: false
      version_code:
        description: 'versionCode для исходников (пусто — номер запуска)'
        type: string
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Ключ загрузки (секрет UPLOAD_KEYSTORE_PW)
        if: ${{ !inputs.src_only }}
        env:
          PW: ${{ secrets.UPLOAD_KEYSTORE_PW }}
        run: |
          if [ -z "$PW" ]; then echo "::error::Нет секрета UPLOAD_KEYSTORE_PW (Settings → Secrets and variables → Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../keystore/upload.jks.enc -out $RUNNER_TEMP/upload.jks -pass env:PW
          keytool -list -keystore $RUNNER_TEMP/upload.jks -storepass "$PW" | grep -i "SHA-256"
      - name: Установка Capacitor 8
        run: npm install
      - name: Android-проект (API 36)
        run: |
          npx cap add android
          npx cap sync android
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" android/variables.gradle
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' $M
          # рекламный идентификатор не используется: запретить, даже если его добавит библиотека
          grep -q 'xmlns:tools' $M || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android"#& xmlns:tools="http://schemas.android.com/tools"#' $M
          grep -q 'permission.AD_ID' $M || sed -i 's#</manifest>#    <uses-permission android:name="com.google.android.gms.permission.AD_ID" tools:node="remove" />\n</manifest>#' $M
          # камера для <input capture> (Фотообмер): с Android 11 приложение камеры видно только через <queries>,
          # иначе Capacitor не находит его и открывает выбор файлов вместо съёмки
          grep -q 'media.action.IMAGE_CAPTURE' $M || sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.media.action.IMAGE_CAPTURE" />\n        </intent>\n    </queries>\n</manifest>#' $M
          grep -c 'media.action.IMAGE_CAPTURE' $M
          # файл проекта .bimsk: фильтры «Открыть в BIMsketcher» после первого </intent-filter> (MAIN/LAUNCHER)
          grep -q 'x-bimsketcher' $M || python3 -c "import sys;p=sys.argv[1];s=open(p).read();f=open(sys.argv[2]).read();i=s.index('</intent-filter>')+len('</intent-filter>');open(p,'w').write(s[:i]+'\n'+f+s[i:])" $M ../native3d/intent-filters.xml
          grep -c 'x-bimsketcher' $M
          cat $M
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(sed -n 's/^package \(.*\);/\1/p' "$MA")
          D=$(dirname "$MA")
          sed "s/^package PKG;/package $PKG;/" ../native/CompassPlugin.java > "$D/CompassPlugin.java"
          sed "s/^package PKG;/package $PKG;/" ../native3d/MainActivity.java > "$MA"
          # BIMsketcher Pro (Google Play Billing): PRO=1 builds it in; PRO=0 leaves the app without billing
          PRO=1
          if [ "$PRO" = "1" ]; then
            sed "s/^package PKG;/package $PKG;/" ../native3d/BillingPlugin.java > "$D/BillingPlugin.java"
            G=android/app/build.gradle
            grep -q 'billingclient' $G || sed -i '0,/^dependencies {/s##dependencies {\n    implementation "com.android.billingclient:billing:9.1.0"#' $G
            grep -n 'billingclient' $G
            # white list (Firebase REST + Google sign-in via Credential Manager)
            sed "s/^package PKG;/package $PKG;/" ../native3d/WhitelistPlugin.java > "$D/WhitelistPlugin.java"
            grep -q 'androidx.credentials:credentials:' $G || sed -i '0,/^dependencies {/s##dependencies {\n    implementation "androidx.credentials:credentials:1.5.0"\n    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"\n    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"#' $G
            grep -n 'credentials\|googleid' $G
          else
            sed -i '/registerPlugin(BillingPlugin.class);/d; /registerPlugin(WhitelistPlugin.class);/d' "$MA"
            ! grep -n 'BillingPlugin' "$MA"
          fi
          echo "package: $PKG"
      - name: Firebase (белый список) из секрета GOOGLE_SERVICES_JSON
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          X=android/app/src/main/res/values/whitelist.xml
          printf '%s' "$GS" | python3 -c "
          import json,sys
          from xml.sax.saxutils import escape as e
          s=sys.stdin.read().strip(); k=p=w=''
          if s:
            j=json.loads(s); p=j['project_info']['project_id']
            c=[c for c in j['client'] if c['client_info']['android_client_info']['package_name']=='com.bimsketcher.app'][0]
            k=c['api_key'][0]['current_key']; w=[o['client_id'] for o in c.get('oauth_client',[]) if o.get('client_type')==3][0]
          open(sys.argv[1],'w').write('<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n  <string name=\"wl_api_key\" translatable=\"false\">%s</string>\n  <string name=\"wl_project\" translatable=\"false\">%s</string>\n  <string name=\"wl_web_client\" translatable=\"false\">%s</string>\n</resources>\n'%(e(k),e(p),e(w)))
          print('firebase:', p or 'не подключён')
          " $X
      - name: Значок
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icons/$d.png android/app/src/main/res/mipmap-$d/$n.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Номер версии
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          echo "APP_VER=$V" >> $GITHUB_ENV
          G=android/app/build.gradle
          VC="${{ inputs.version_code }}"; [ -z "$VC" ] && VC=${{ github.run_number }}
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"$V\"/" $G
          grep -E "versionCode|versionName|applicationId" $G
      - name: Сборка APK и AAB
        if: ${{ !inputs.src_only }}
        env:
          PW: ${{ secrets.UPLOAD_KEYSTORE_PW }}
        run: |
          cd android
          chmod +x gradlew
          SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks -Pandroid.injected.signing.store.password=$PW -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password=$PW"
          ./gradlew assembleRelease bundleRelease --no-daemon $SIGN
          cp app/build/outputs/apk/release/app-release.apk ../BIMsketcher-${{ env.APP_VER }}.apk
          cp app/build/outputs/bundle/release/app-release.aab ../BIMsketcher-${{ env.APP_VER }}.aab
          ls -la ..
      - name: Исходники Android-проекта (ZIP для Android Studio / Cursor, без ключа подписи)
        run: |
          trap 'echo "::error::строка $LINENO: $BASH_COMMAND"' ERR
          V=${{ env.APP_VER }}; T=$RUNNER_TEMP/src; D=$T/BIMsketcher-android; rm -rf $T; mkdir -p $D
          ls -la; ls node_modules/@capacitor || true
          tar --exclude=./node_modules --exclude=./android/app/build --exclude=./android/build --exclude=./android/.gradle --exclude=./android/capacitor-cordova-android-plugins/build --exclude=./android/local.properties --exclude=./android/app/src/main/res/values/whitelist.xml --exclude='*.apk' --exclude='*.aab' --exclude='*.zip' -cf - . | tar -xf - -C $D
          mkdir -p $D/node_modules/@capacitor
          for p in android filesystem share; do (cd node_modules/@capacitor && tar --exclude=build --exclude=.gradle -cf - $p) | tar -xf - -C $D/node_modules/@capacitor; done
          cp -r ../web-src ../i18n $D/; mkdir -p $D/native; cp ../native/CompassPlugin.java ../native3d/MainActivity.java ../native3d/BillingPlugin.java ../native3d/WhitelistPlugin.java $D/native/; cp ../android-src/README.md $D/README.md
          if [ -n "$(find $D -name '*.jks*')" ]; then echo "::error::ключ подписи попал в архив"; exit 1; fi
          (cd $T && zip -qr $GITHUB_WORKSPACE/app3d/BIMsketcher-android-src-$V.zip BIMsketcher-android); ls -la $GITHUB_WORKSPACE/app3d/*.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.src_only }}
        with:
          name: BIMsketcher
          path: |
            app3d/BIMsketcher-${{ env.APP_VER }}.apk
            app3d/BIMsketcher-${{ env.APP_VER }}.aab
      - name: Выпуск для скачивания
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3d-${{ env.APP_VER }}
          name: BIMsketcher ${{ env.APP_VER }}
          files: |
            app3d/BIMsketcher-${{ env.APP_VER }}.apk
            app3d/BIMsketcher-${{ env.APP_VER }}.aab
            app3d/BIMsketcher-android-src-${{ env.APP_VER }}.zip
          make_latest: false
