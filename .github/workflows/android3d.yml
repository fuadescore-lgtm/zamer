name: Сборка BIMsketcher (APK + AAB для Google Play)
on:
  push:
    branches: [main]
    paths: ['app3d/**', 'native/**', 'native3d/**', 'keystore/upload.jks.enc', '.github/workflows/android3d.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Ключ загрузки (секрет UPLOAD_KEYSTORE_PW)
        env:
          PW: ${{ secrets.UPLOAD_KEYSTORE_PW }}
        run: |
          if [ -z "$PW" ]; then echo "::error::Нет секрета UPLOAD_KEYSTORE_PW (Settings → Secrets and variables → Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../keystore/upload.jks.enc -out $RUNNER_TEMP/upload.jks -pass env:PW
          keytool -list -keystore $RUNNER_TEMP/upload.jks -storepass "$PW" | grep -i "SHA-256"
      - name: Установка Capacitor 8
        run: npm install
      - name: Android-проект (API 36)
        run: |
          npx cap add android
          npx cap sync android
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" android/variables.gradle
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' $M
          # рекламный идентификатор не используется: запретить, даже если его добавит библиотека
          grep -q 'xmlns:tools' $M || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android"#& xmlns:tools="http://schemas.android.com/tools"#' $M
          grep -q 'permission.AD_ID' $M || sed -i 's#</manifest>#    <uses-permission android:name="com.google.android.gms.permission.AD_ID" tools:node="remove" />\n</manifest>#' $M
          cat $M
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(sed -n 's/^package \(.*\);/\1/p' "$MA")
          D=$(dirname "$MA")
          sed "s/^package PKG;/package $PKG;/" ../native/CompassPlugin.java > "$D/CompassPlugin.java"
          sed "s/^package PKG;/package $PKG;/" ../native3d/MainActivity.java > "$MA"
          echo "package: $PKG"
      - name: Значок
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icons/$d.png android/app/src/main/res/mipmap-$d/$n.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Номер версии
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          echo "APP_VER=$V" >> $GITHUB_ENV
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" $G
          grep -E "versionCode|versionName|applicationId" $G
      - name: Сборка APK и AAB
        env:
          PW: ${{ secrets.UPLOAD_KEYSTORE_PW }}
        run: |
          cd android
          chmod +x gradlew
          SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks -Pandroid.injected.signing.store.password=$PW -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password=$PW"
          ./gradlew assembleRelease bundleRelease --no-daemon $SIGN
          cp app/build/outputs/apk/release/app-release.apk ../BIMsketcher-${{ env.APP_VER }}.apk
          cp app/build/outputs/bundle/release/app-release.aab ../BIMsketcher-${{ env.APP_VER }}.aab
          ls -la ..
      - uses: actions/upload-artifact@v4
        with:
          name: BIMsketcher
          path: |
            app3d/BIMsketcher-${{ env.APP_VER }}.apk
            app3d/BIMsketcher-${{ env.APP_VER }}.aab
      - name: Выпуск для скачивания
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3d-${{ env.APP_VER }}
          name: BIMsketcher ${{ env.APP_VER }}
          files: |
            app3d/BIMsketcher-${{ env.APP_VER }}.apk
            app3d/BIMsketcher-${{ env.APP_VER }}.aab
          make_latest: false
