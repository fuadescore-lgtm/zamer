name: dwgnet
# DWG writer/reader for BIMsketcher: ACadSharp (MIT) → .NET WebAssembly. Manual run only; the result is an artifact.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: wasm workload
        run: dotnet workload install wasm-tools
      - name: publish
        run: |
          set -o pipefail
          dotnet publish dwgnet/DwgNet.csproj -c Release -o out 2>&1 | tee publish.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: smoke test (write DWG, read it back)
        run: |
          ls -la out/wwwroot/_framework | tee files.txt
          du -sh out/wwwroot/_framework | tee -a files.txt
          cp dwgnet/main.js out/wwwroot/main.mjs
          set -o pipefail
          cd out/wwwroot && node main.mjs 2>&1 | tee ../../smoke.log
      - name: cross-check with an independent DWG reader (test only, not shipped)
        continue-on-error: true
        run: |
          curl -sL https://github.com/LibreDWG/libredwg/releases/download/0.13.3/libredwg-0.13.3.tar.xz | tar xJ
          sudo apt-get install -y -qq texinfo > /dev/null 2>&1 || true
          (cd libredwg-0.13.3 && ./configure -q --disable-bindings --disable-python > cfg.log 2>&1; tail -5 cfg.log; make -j4 -C src CFLAGS='-O2 -w' > mk.log 2>&1; tail -15 mk.log; make -j4 -C programs dwgread CFLAGS='-O2 -w' > mk2.log 2>&1; tail -15 mk2.log) || true
          ls -la libredwg-0.13.3/programs/dwgread || true
          R=libredwg-0.13.3/programs
          for f in out/wwwroot/test*.dwg dwgnet/samples/*.dwg; do echo "== $f"; $R/dwgread -v2 "$f" -O DXF -o "$f.chk.dxf" 2>&1 | grep -iE "error|warn|fail" | head -8; for k in LINE ARC CIRCLE TEXT 3DFACE POLYLINE DIMENSION; do echo "  $k $(grep -c "^$k\s*$" "$f.chk.dxf" 2>/dev/null)"; done; done 2>&1 | tee check.log
      - name: publish build as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out/wwwroot && zip -qr ../../dwgnet.zip _framework test*.dwg test*_back.dxf && cd ../..
          zip -qj dwgnet.zip publish.log smoke.log files.txt check.log || true
          gh release delete dwgnet-build -y --cleanup-tag 2>/dev/null || true
          gh release create dwgnet-build dwgnet.zip --prerelease --title "dwgnet build (internal)" --notes "ACadSharp (MIT) WebAssembly build for BIMsketcher DWG export/import"
