name: Модели ИИ для PHOTOGRAM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ai-models.yml', 'tools/ai/**']
permissions:
  contents: write
jobs:
  windet:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.8' }
      - name: Зависимости
        run: |
          pip install --quiet torch==1.4.0+cpu torchvision==0.5.0+cpu -f https://download.pytorch.org/whl/torch_stable.html
          pip install --quiet matplotlib gdown easydict pyyaml scipy munkres shapely opencv-python-headless "onnx<1.15" "numpy<1.24" "protobuf<4"
      - name: Модель поиска окон (win_det_heatmaps, MobileNetV2)
        run: |
          git clone --depth 1 https://github.com/lck1201/win_det_heatmaps wdh
          mkdir -p dl && cd dl
          sed -i 's/yaml.load(f)/yaml.load(f, Loader=yaml.FullLoader)/' ../wdh/common_pytorch/config_pytorch.py
          python - <<'PY'
          import gdown
          try:
              files = gdown.download_folder("https://drive.google.com/drive/folders/1TfeIcQ8KlEvP1-ewGcTaj3SqU_IpoLUv", skip_download=True, quiet=True)
              for f in files: print("FILE", f.path, f.id)
              want = [f for f in files if 'mobile' in f.path.lower() and not f.path.lower().endswith('.zip')] or [f for f in files if f.path.lower().endswith(('.tar', '.pth', '.pt'))]
              for f in want[:2]: gdown.download(id=f.id, output=f.path.replace('/', '_'), quiet=False)
          except Exception as e:
              print("ERR", e)
          PY
          ls -la
      - name: Экспорт в ONNX
        run: |
          CK=$(find dl -type f -iname "*mobile*" | grep -iv "\.zip$" | head -1)
          [ -z "$CK" ] && CK=$(find dl -type f \( -iname "*.tar" -o -iname "*.pth" \) | head -1)
          echo "ckpt: $CK"
          python tools/ai/export_windet.py wdh "$CK" windet_mbv2.onnx
          ls -la windet_mbv2.onnx
      - name: Выпуск
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release view ai-models-1 >/dev/null 2>&1 || gh release create ai-models-1 --title "Модели ИИ для PHOTOGRAM" --notes "windet_mbv2.onnx — поиск окон по углам (lck1201/win_det_heatmaps, MIT)" --latest=false
          gh release upload ai-models-1 windet_mbv2.onnx --clobber

  doors:
    if: contains(github.event.head_commit.message, 'обучение дверей')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Зависимости
        run: |
          pip install --quiet torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet gdown pyyaml pillow onnx
      - name: Данные (двери и окна, 1000 фасадов)
        run: |
          mkdir -p data && cd data
          gdown 1CBHbUsdOAIOCEYi4oAB03senfi_9-WpP -O dw.zip
          unzip -q dw.zip || (pip install --quiet patool rarfile && python -c "import patoolib; patoolib.extract_archive('dw.zip', outdir='.')")
          find . -maxdepth 3 -type d | head -30; find . -name "*.yaml" | head; find . -name "*.txt" | head -3
      - name: Прошлые веса
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release download ai-models-1 -p doors_frcnn.onnx.pt -O prev.pt || true
      - name: Обучение
        env: { TRAIN_SECONDS: '15000', LR: '0.005' }
        run: python tools/ai/train_doors.py data doors_frcnn.onnx 25
      - name: Выпуск
        if: always()
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          ls -la doors_frcnn* || true
          gh release view ai-models-1 >/dev/null 2>&1 || gh release create ai-models-1 --title "Модели ИИ для PHOTOGRAM" --notes "модели" --latest=false
          for f in doors_frcnn.onnx doors_frcnn.onnx.pt doors_frcnn.onnx.names.txt; do [ -f $f ] && gh release upload ai-models-1 $f --clobber; done

  doors-export:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'экспорт дверей')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Зависимости
        run: |
          pip install --quiet torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet gdown pillow onnx onnxruntime
      - name: Данные для проверки и веса
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          mkdir -p data && cd data && gdown 1CBHbUsdOAIOCEYi4oAB03senfi_9-WpP -O dw.zip && unzip -q dw.zip && cd ..
          gh release download ai-models-1 -p doors_frcnn.onnx.pt
      - name: Экспорт и проверка
        run: python tools/ai/export_doors.py doors_frcnn.onnx.pt doors_frcnn.onnx
      - name: Выпуск
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload ai-models-1 doors_frcnn.onnx --clobber
