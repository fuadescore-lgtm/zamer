name: Модели ИИ для PHOTOGRAM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ai-models.yml', 'tools/ai/**']
permissions:
  contents: write
jobs:
  windet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Зависимости
        run: |
          pip install --quiet torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet gdown easydict pyyaml scipy munkres shapely opencv-python-headless onnx "numpy<2"
      - name: Модель поиска окон (win_det_heatmaps, MobileNetV2)
        run: |
          git clone --depth 1 https://github.com/lck1201/win_det_heatmaps wdh
          mkdir -p dl && cd dl
          sed -i 's/yaml.load(f)/yaml.load(f, Loader=yaml.FullLoader)/' ../wdh/common_pytorch/config_pytorch.py
          python - <<'PY'
          import gdown
          try:
              files = gdown.download_folder("https://drive.google.com/drive/folders/1TfeIcQ8KlEvP1-ewGcTaj3SqU_IpoLUv", skip_download=True, quiet=True)
              for f in files: print("FILE", f.path, f.id)
              want = [f for f in files if 'mobile' in f.path.lower() and not f.path.lower().endswith('.zip')] or [f for f in files if f.path.lower().endswith(('.tar', '.pth', '.pt'))]
              for f in want[:2]: gdown.download(id=f.id, output=f.path.replace('/', '_'), quiet=False)
          except Exception as e:
              print("ERR", e)
          PY
          ls -la
      - name: Экспорт в ONNX
        run: |
          CK=$(find dl -type f -iname "*mobile*" | grep -iv "\.zip$" | head -1)
          [ -z "$CK" ] && CK=$(find dl -type f \( -iname "*.tar" -o -iname "*.pth" \) | head -1)
          echo "ckpt: $CK"
          python tools/ai/export_windet.py wdh "$CK" windet_mbv2.onnx
          ls -la windet_mbv2.onnx
      - name: Выпуск
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release view ai-models-1 >/dev/null 2>&1 || gh release create ai-models-1 --title "Модели ИИ для PHOTOGRAM" --notes "windet_mbv2.onnx — поиск окон по углам (lck1201/win_det_heatmaps, MIT)" --latest=false
          gh release upload ai-models-1 windet_mbv2.onnx --clobber
