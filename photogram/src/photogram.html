<style>
/* Layout: one-column field-notebook app — header bar, photo sheet with measurement overlay, results ledger below. */
:root {
  --bg: #EEF1EE;
  --surface: #FFFFFF;
  --sunken: #E3E8E4;
  --ink: #17232A;
  --muted: #56666C;
  --line: #CFD7D2;

  --open: #0A7487;        /* проёмы */
  --open-soft: rgba(10,116,135,.12);
  --warn: #9A5B00;
  --warn-bg: #FFF2D6;
  --danger: #B3261E;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1619; --surface: #172126; --sunken: #111A1E; --ink: #E4EBE8; --muted: #91A2A7; --line: #2A393F;
  --tape: #F0B72A; --tape-ink: #F0B72A; --open: #44C2D3; --open-soft: rgba(68,194,211,.14);

:root[data-theme="dark"] {
  --bg: #0F1619; --surface: #172126; --sunken: #111A1E; --ink: #E4EBE8; --muted: #91A2A7; --line: #2A393F;
  --tape: #F0B72A; --tape-ink: #F0B72A; --open: #44C2D3; --open-soft: rgba(68,194,211,.14);
  --warn: #F3C46B; --warn-bg: #3A2C10; --danger: #F2867E; color-scheme: dark; }

html, body { height: 100%; }

* { box-sizing: border-box; }

.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.plist { display: flex; flex-direction: column; gap: 10px; }

/* Слоты съёмки */
.side { display: grid; gap: 8px; }
.side h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

  display: flex; flex-direction: column; justify-content: flex-end; padding: 6px; text-align: left; overflow: hidden; }
.slot.has { border-style: solid; }
.slot .lab { font-size: 11px; font-weight: 600; background: var(--surface); color: var(--ink); border-radius: 6px; padding: 2px 6px; align-self: flex-start; }
.slot .plus { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 26px; }

.diagram { width: 100%; max-width: 360px; height: auto; display: block; }

/* Лист замера */
.sheet { position: relative; background: var(--sunken); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
#cv { display: block; width: 100%; height: min(62vh, 560px); touch-action: none; cursor: crosshair; }
.zoom { display: flex; gap: 8px; align-items: center; margin-top: -8px; }
.zoom button { min-width: 44px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; padding: 0 10px; }
.zoom span { font-size: 13px; color: var(--muted); }
.hint { font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--tape); border-radius: 10px; padding: 10px 12px; }
.hint.open { border-left-color: var(--open); }
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.tools .btn { padding: 8px 6px; font-size: 14px; }

/* Ведомость */
.ledger { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.sel td { background: var(--open-soft); }
tr.refrow td { background: color-mix(in srgb, var(--tape) 12%, transparent); }
.tag { display: inline-block; min-width: 30px; font-weight: 600; }
.tol { color: var(--muted); font-size: 12px; }
.warnchip { display: inline-block; margin-top: 2px; font-size: 12px; color: var(--warn); }
.tapechip { display: inline-block; margin-top: 2px; font-size: 12px; color: var(--tape-ink); }
.truef { display: grid; gap: 8px; }
.truef .two3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.linkbtn { border: 0; background: none; padding: 4px 6px; color: var(--muted); font-size: 13px; text-decoration: underline; }
.linkbtn.danger { color: var(--danger); }

label.btn { display: inline-flex; align-items: center; justify-content: center; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; }
.picker { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(0,0,0,.12); display: grid; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.picker .row .btn { flex: 1 1 140px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } .bar h1 { font-size: 17px; } }

<script>
"use strict";
/* ---------- Справочники ---------- */
const SIDES = [1, 2, 3, 4];
const POS = [["L", "Левый угол"], ["F", "Фронтально"], ["R", "Правый угол"]];
const SLOT_ORDER = SIDES.flatMap(s => POS.map(p => "s" + s + p[0]));
const TYPES = {
  win:  { name: "Окно",    pre: "О", pts: 4 },
  door: { name: "Дверь",   pre: "Д", pts: 4 },
  gate: { name: "Ворота",  pre: "В", pts: 4 },
  open: { name: "Проём",   pre: "П", pts: 4 },
  line: { name: "Отрезок", pre: "Л", pts: 2 },
  ridge: { name: "Конёк", pre: "К", pts: 1 },
  chim: { name: "Дымоход", pre: "Т", pts: 4 },
};
const REF_KINDS = {
  wall:  { name: "Стена: длина × высота", zero: "от низа стены" },
  dopen: { name: "Дверной проём по фасаду", zero: "от порога" },
  dframe:{ name: "Дверь по коробке", zero: "от порога" },
  win:   { name: "Окно (проём по фасаду)", zero: "от низа окна-эталона" },
  rect:  { name: "Другой прямоугольник", zero: "от низа эталона" },
};

/* ---------- Состояние ---------- */
const S = {
  db: null, assets: null, uid: null, col: null,
  cloud: false, loaded: false, loadErr: "",
  projects: new Map(),   // id -> project
  view: "list", cur: null, slot: null,
  tool: null, draft: [], sel: null, confirm: null,
};
const $ = s => document.querySelector(s);
// Связь с редактором плана (копия движка во фрейме) — сообщениями postMessage
const PG_VER = "__PG_VER__";
const HAS_ENGINE = !!document.getElementById("bskInline") || !!window.__PG_ENGINE;
const EMBED = false; let CAN_PLAN = HAS_ENGINE; const planWait = new Map(); let ENG = null;
window.addEventListener("message", e => {
  const d = e.data; if (!d || d.bsk !== 1 || !ENG || e.source !== ENG.f.contentWindow) return;
  if (d.type === "planResult" && planWait.has(d.id)) { planWait.get(d.id)(d.res); planWait.delete(d.id); }
});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const slotName = k => "Сторона " + k[1] + " · " + POS.find(p => p[0] === k[2])[1].toLowerCase();

function setStatus(t, err) { const el = $("#status"); el.textContent = t || ""; el.classList.toggle("err", !!err); }

/* ---------- Геометрия: гомография ---------- */
function solve(A, b) {               // Гаусс с выбором главного элемента
  const n = b.length; A = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let m = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[m][c])) m = r;
    if (Math.abs(A[m][c]) < 1e-12) return null;
    [A[c], A[m]] = [A[m], A[c]];
    for (let r = 0; r < n; r++) if (r !== c) { const f = A[r][c] / A[c][c]; for (let k = c; k <= n; k++) A[r][k] -= f * A[c][k]; }
  }
  return A.map((r, i) => r[n] / r[i]);
}
function homog(src, dst) {           // 4 точки src -> dst
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  const h = solve(A, b); return h ? [...h, 1] : null;
}
function apply(H, [x, y]) { const w = H[6] * x + H[7] * y + H[8]; return [(H[0] * x + H[1] * y + H[2]) / w, (H[3] * x + H[4] * y + H[5]) / w]; }
function sortQuad(pts) {             // -> ВЛ, ВП, НП, НЛ (в координатах фото, y вниз)
  const cx = pts.reduce((a, p) => a + p[0], 0) / 4, cy = pts.reduce((a, p) => a + p[1], 0) / 4;
  const s = [...pts].sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
  // после сортировки по углу первая точка — с углом около -135° (верхняя левая)
  let k = 0, best = Infinity; s.forEach((p, i) => { const v = p[0] + p[1]; if (v < best) { best = v; k = i; } });
  return [...s.slice(k), ...s.slice(0, k)];
}
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function refMatrix(ph) {
  const r = ph && ph.ref; if (!r || !(r.W > 0) || !(r.H > 0) || r.pts.length !== 4) return null;
  return homog(sortQuad(r.pts), [[0, r.H], [r.W, r.H], [r.W, 0], [0, 0]]);
}
function mmPerPx(H, c) { const a = apply(H, c); return Math.max(dist(a, apply(H, [c[0] + 1, c[1]])), dist(a, apply(H, [c[0], c[1] + 1]))); }
function measure(ph, it, H) {
  if (!H) return null;
  if (it.type === "ridge") {
    if (!it.pts.length) return null;
    const a = apply(H, it.pts[0]);
    return { z: a[1], along: a[0], tolZ: 2 * mmPerPx(H, it.pts[0]) };
  }
  if (it.type === "line") {
    if (it.pts.length < 2) return null;
    const a = apply(H, it.pts[0]), b = apply(H, it.pts[1]);
    const k = Math.max(mmPerPx(H, it.pts[0]), mmPerPx(H, it.pts[1]));
    return { len: dist(a, b), tolL: 2 * k };
  }
  if (it.pts.length < 4) return null;
  const qi = sortQuad(it.pts), q = qi.map(p => apply(H, p));
  const wTop = q[1][0] - q[0][0], wBot = q[2][0] - q[3][0], hL = q[0][1] - q[3][1], hR = q[1][1] - q[2][1];
  const c = [qi.reduce((a, p) => a + p[0], 0) / 4, qi.reduce((a, p) => a + p[1], 0) / 4];
  const k = mmPerPx(H, c);
  return {
    w: Math.abs((wTop + wBot) / 2), h: Math.abs((hL + hR) / 2),
    tolW: Math.hypot((wTop - wBot) / 2, 2 * k), tolH: Math.hypot((hL - hR) / 2, 2 * k),
    bottom: (q[2][1] + q[3][1]) / 2, left: (q[0][0] + q[3][0]) / 2,
  };
}
const r5 = v => Math.round(v / 5) * 5;
// размер элемента для таблиц: конёк — высота, отрезок — длина, остальное — ширина × высота
function sizeText(it, m, tol) {
  if (!m) return "—";
  if (m.z != null) return "выс. " + fmm(m.z) + (tol ? `<br><span class="tol">${ftol(m.tolZ)}</span>` : "");
  if (m.len != null) return fmm(m.len) + (tol ? `<br><span class="tol">${ftol(m.tolL)}</span>` : "");
  return (it.type === "chim" ? "≈ " : "") + fmm(m.w) + " × " + fmm(m.h) + (tol && it.type !== "chim" ? `<br><span class="tol">${ftol(Math.max(m.tolW, m.tolH))}</span>` : "");
}
const fmm = v => r5(v).toLocaleString("ru-RU");
const ftol = v => "± " + Math.max(5, r5(v));
function warnings(it, m) {
  if (!m) return [];
  const w = [];
  if (it.type === "door" && (m.h < 1800 || m.h > 2600)) w.push("Высота двери нетипична: проверьте эталон");
  if (it.type === "win" && (m.w > 4000 || m.h > 3000 || m.w < 250)) w.push("Размер окна нетипичен: проверьте эталон");
  if (it.type === "chim") w.push("Труба не в плоскости стены: на фасаде размеры условные, в модели — по двум снимкам");
  else if (m.tolW > 40 || m.tolH > 40) w.push("Углы отмечены неровно или элемент не в плоскости эталона");
  return w;
}

/* ---------- Пример (генерируется на месте) ---------- */

    const ph = { w, h, ref: null, items: [], local: await localUrl(blob) };

      try { const r = await S.assets.upload(blob, { type: "image/jpeg" }); ph.asset = r.id; }

}

/* ---------- Адрес и место объекта на карте ----------

function geoHTML(p) {

    <div class="row" style="justify-content:space-between">

  ad.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); p.address = ad.value.trim(); touch(p); if (S.mapOpen === p.id) geoSearch(p); else ad.blur(); } };
  $("#gtog").onclick = () => { S.mapOpen = S.mapOpen === p.id ? null : p.id; GEO.msg = ""; GEO.err = false; render(); };
  if (S.mapOpen !== p.id) return;
  document.querySelectorAll("[data-lay]").forEach(b => b.onclick = () => { GEO.layer = b.dataset.lay; if (GEO.map) geoTiles(); document.querySelectorAll("[data-lay]").forEach(x => x.classList.toggle("on", x === b)); });

  $("#ggps").onclick = () => geoGPS(p);

    geoTiles();
    GEO.map.on("click", e => { const cur = S.cur; if (!cur || cur.example) return; geoSet(cur, e.latlng.lat, e.latlng.lng, "map", 0); if (!(cur.address || "").trim()) geoReverse(cur, false); else geoSay("Точка поставлена. «Адрес по точке» — подставить адрес отсюда."); });

      : "GPS сейчас недоступен. Поставьте точку касанием карты или найдите по адресу.", true);

async function geoSearch(p) {

  geoBusy("Ищу адрес…");
  try {
    const r = await geoFetch("search?limit=1&q=" + encodeURIComponent(q));

    if (!r.length) { geoSay("Адрес не найден. Уточните (город, улица, номер) или поставьте точку касанием карты.", true); return; }

/* ---------- Экран: объект ---------- */
