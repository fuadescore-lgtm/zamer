<style>
/* Layout: one-column field-notebook app — header bar, photo sheet with measurement overlay, results ledger below. */
:root {
  --bg: #EEF1EE;
  --surface: #FFFFFF;
  --sunken: #E3E8E4;
  --ink: #17232A;
  --muted: #56666C;
  --line: #CFD7D2;
  --tape: #D99A00;        /* эталон: цвет рулетки */
  --tape-ink: #6E4E00;
  --open: #0A7487;        /* проёмы */
  --open-soft: rgba(10,116,135,.12);
  --warn: #9A5B00;
  --warn-bg: #FFF2D6;
  --danger: #B3261E;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1619; --surface: #172126; --sunken: #111A1E; --ink: #E4EBE8; --muted: #91A2A7; --line: #2A393F;
  --tape: #F0B72A; --tape-ink: #F0B72A; --open: #44C2D3; --open-soft: rgba(68,194,211,.14);
  --warn: #F3C46B; --warn-bg: #3A2C10; --danger: #F2867E; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1619; --surface: #172126; --sunken: #111A1E; --ink: #E4EBE8; --muted: #91A2A7; --line: #2A393F;
  --tape: #F0B72A; --tape-ink: #F0B72A; --open: #44C2D3; --open-soft: rgba(68,194,211,.14);
  --warn: #F3C46B; --warn-bg: #3A2C10; --danger: #F2867E; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--open); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; min-height: 54px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 6px; }
.bar h1 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .01em; }
.back { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 22px; line-height: 1; }
.back:hover { background: var(--sunken); }
.status { font-size: 12px; color: var(--muted); white-space: nowrap; }
.status.err { color: var(--danger); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--muted); font-weight: 600; margin: 0; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 500; min-height: 42px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.tape { background: var(--tape); color: #1B1300; border-color: var(--tape); }
.btn.danger { color: var(--danger); }
.btn.on { outline: 2px solid var(--open); outline-offset: -2px; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* Список объектов */
.plist { display: flex; flex-direction: column; gap: 10px; }
.pitem { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.pitem:hover { border-color: var(--muted); }
.pthumb { width: 64px; height: 48px; border-radius: 8px; background: var(--sunken) center/cover no-repeat; }
.pitem .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .s { font-size: 13px; color: var(--muted); }
.badge { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.form { display: grid; gap: 10px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 9px 11px; min-height: 42px; width: 100%; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Слоты съёмки */
.side { display: grid; gap: 8px; }
.side h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 10px; border: 1px dashed var(--line); background: var(--surface) center/cover no-repeat;
  display: flex; flex-direction: column; justify-content: flex-end; padding: 6px; text-align: left; overflow: hidden; }
.slot.has { border-style: solid; }
.slot .lab { font-size: 11px; font-weight: 600; background: var(--surface); color: var(--ink); border-radius: 6px; padding: 2px 6px; align-self: flex-start; }
.slot .plus { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 26px; }
.slot .cnt { position: absolute; top: 6px; right: 6px; font-size: 11px; font-weight: 600; background: var(--open); color: var(--surface); border-radius: 999px; padding: 1px 7px; }
.slot .busy { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 70%, transparent); font-size: 13px; }
.diagram { width: 100%; max-width: 360px; height: auto; display: block; }

/* Лист замера */
.sheet { position: relative; background: var(--sunken); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
#cv { display: block; width: 100%; height: min(62vh, 560px); touch-action: none; cursor: crosshair; }
.zoom { display: flex; gap: 8px; align-items: center; margin-top: -8px; }
.zoom button { min-width: 44px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; padding: 0 10px; }
.zoom span { font-size: 13px; color: var(--muted); }
.hint { font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--tape); border-radius: 10px; padding: 10px 12px; }
.hint.open { border-left-color: var(--open); }
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.tools .btn { padding: 8px 6px; font-size: 14px; }

/* Ведомость */
.ledger { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.sel td { background: var(--open-soft); }
tr.refrow td { background: color-mix(in srgb, var(--tape) 12%, transparent); }
.tag { display: inline-block; min-width: 30px; font-weight: 600; }
.tol { color: var(--muted); font-size: 12px; }
.warnchip { display: inline-block; margin-top: 2px; font-size: 12px; color: var(--warn); }
.linkbtn { border: 0; background: none; padding: 4px 6px; color: var(--muted); font-size: 13px; text-decoration: underline; }
.linkbtn.danger { color: var(--danger); }

label.btn { display: inline-flex; align-items: center; justify-content: center; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; }
.picker { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(0,0,0,.12); display: grid; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.picker .row .btn { flex: 1 1 140px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } .bar h1 { font-size: 17px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
"use strict";
/* ---------- Справочники ---------- */
const SIDES = [1, 2, 3, 4];
const POS = [["L", "Левый угол"], ["F", "Фронтально"], ["R", "Правый угол"]];
const SLOT_ORDER = SIDES.flatMap(s => POS.map(p => "s" + s + p[0]));
const TYPES = {
  win:  { name: "Окно",    pre: "О", pts: 4 },
  door: { name: "Дверь",   pre: "Д", pts: 4 },
  gate: { name: "Ворота",  pre: "В", pts: 4 },
  open: { name: "Проём",   pre: "П", pts: 4 },
  line: { name: "Отрезок", pre: "Л", pts: 2 },
};
const REF_KINDS = {
  wall:  { name: "Стена: длина × высота", zero: "от низа стены" },
  dopen: { name: "Дверной проём по фасаду", zero: "от порога" },
  dframe:{ name: "Дверь по коробке", zero: "от порога" },
  win:   { name: "Окно (проём по фасаду)", zero: "от низа окна-эталона" },
  rect:  { name: "Другой прямоугольник", zero: "от низа эталона" },
};

/* ---------- Состояние ---------- */
const S = {
  db: null, assets: null, uid: null, col: null,
  cloud: false, loaded: false, loadErr: "",
  projects: new Map(),   // id -> project
  view: "list", cur: null, slot: null,
  tool: null, draft: [], sel: null, confirm: null,
};
const $ = s => document.querySelector(s);
// Связь с BIMsketcher — только сообщениями (postMessage): работает и в APK, и в изолированном просмотре.
// Хозяин отвечает на «hello» — до ответа страница работает как самостоятельный фотообмер.
let EMBED = false, CAN_PLAN = false; const planWait = new Map();
const toHost = m => { try { window.parent.postMessage(Object.assign({ photo: 1 }, m), "*"); } catch (e) {} };
window.addEventListener("message", e => {
  const d = e.data; if (!d || d.bsk !== 1 || e.source !== window.parent) return;
  if (d.type === "host" && !EMBED) { EMBED = true; CAN_PLAN = true; render(); }
  if (d.type === "planResult" && planWait.has(d.id)) { planWait.get(d.id)(d.res); planWait.delete(d.id); }
});
if (window.parent !== window) toHost({ type: "hello" });
function hostPlan(spec) {
  return new Promise(res => { const id = uid(); planWait.set(id, res); toHost({ type: "plan", id, spec });
    setTimeout(() => { if (planWait.has(id)) { planWait.delete(id); res({ ok: false, msg: "BIMsketcher не ответил" }); } }, 8000); });
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const slotName = k => "Сторона " + k[1] + " · " + POS.find(p => p[0] === k[2])[1].toLowerCase();

function setStatus(t, err) { const el = $("#status"); el.textContent = t || ""; el.classList.toggle("err", !!err); }

/* ---------- Геометрия: гомография ---------- */
function solve(A, b) {               // Гаусс с выбором главного элемента
  const n = b.length; A = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let m = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[m][c])) m = r;
    if (Math.abs(A[m][c]) < 1e-12) return null;
    [A[c], A[m]] = [A[m], A[c]];
    for (let r = 0; r < n; r++) if (r !== c) { const f = A[r][c] / A[c][c]; for (let k = c; k <= n; k++) A[r][k] -= f * A[c][k]; }
  }
  return A.map((r, i) => r[n] / r[i]);
}
function homog(src, dst) {           // 4 точки src -> dst
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  const h = solve(A, b); return h ? [...h, 1] : null;
}
function apply(H, [x, y]) { const w = H[6] * x + H[7] * y + H[8]; return [(H[0] * x + H[1] * y + H[2]) / w, (H[3] * x + H[4] * y + H[5]) / w]; }
function sortQuad(pts) {             // -> ВЛ, ВП, НП, НЛ (в координатах фото, y вниз)
  const cx = pts.reduce((a, p) => a + p[0], 0) / 4, cy = pts.reduce((a, p) => a + p[1], 0) / 4;
  const s = [...pts].sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
  // после сортировки по углу первая точка — с углом около -135° (верхняя левая)
  let k = 0, best = Infinity; s.forEach((p, i) => { const v = p[0] + p[1]; if (v < best) { best = v; k = i; } });
  return [...s.slice(k), ...s.slice(0, k)];
}
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function refMatrix(ph) {
  const r = ph && ph.ref; if (!r || !(r.W > 0) || !(r.H > 0) || r.pts.length !== 4) return null;
  return homog(sortQuad(r.pts), [[0, r.H], [r.W, r.H], [r.W, 0], [0, 0]]);
}
function mmPerPx(H, c) { const a = apply(H, c); return Math.max(dist(a, apply(H, [c[0] + 1, c[1]])), dist(a, apply(H, [c[0], c[1] + 1]))); }
function measure(ph, it, H) {
  if (!H) return null;
  if (it.type === "line") {
    if (it.pts.length < 2) return null;
    const a = apply(H, it.pts[0]), b = apply(H, it.pts[1]);
    const k = Math.max(mmPerPx(H, it.pts[0]), mmPerPx(H, it.pts[1]));
    return { len: dist(a, b), tolL: 2 * k };
  }
  if (it.pts.length < 4) return null;
  const qi = sortQuad(it.pts), q = qi.map(p => apply(H, p));
  const wTop = q[1][0] - q[0][0], wBot = q[2][0] - q[3][0], hL = q[0][1] - q[3][1], hR = q[1][1] - q[2][1];
  const c = [qi.reduce((a, p) => a + p[0], 0) / 4, qi.reduce((a, p) => a + p[1], 0) / 4];
  const k = mmPerPx(H, c);
  return {
    w: Math.abs((wTop + wBot) / 2), h: Math.abs((hL + hR) / 2),
    tolW: Math.hypot((wTop - wBot) / 2, 2 * k), tolH: Math.hypot((hL - hR) / 2, 2 * k),
    bottom: (q[2][1] + q[3][1]) / 2, left: (q[0][0] + q[3][0]) / 2,
  };
}
const r5 = v => Math.round(v / 5) * 5;
const fmm = v => r5(v).toLocaleString("ru-RU");
const ftol = v => "± " + Math.max(5, r5(v));
function warnings(it, m) {
  if (!m) return [];
  const w = [];
  if (it.type === "door" && (m.h < 1800 || m.h > 2600)) w.push("Высота двери нетипична: проверьте эталон");
  if (it.type === "win" && (m.w > 4000 || m.h > 3000 || m.w < 250)) w.push("Размер окна нетипичен: проверьте эталон");
  if (m.tolW > 40 || m.tolH > 40) w.push("Углы отмечены неровно или элемент не в плоскости эталона");
  return w;
}

/* ---------- Пример (генерируется на месте) ---------- */
// Дом 9000 × 7000 мм, стены 3000 мм: четыре фасада с известными размерами проёмов.
const DEMO = {
  s1F: { W: 9000, H: 3000, gable: true, q: [[250, 470], [1370, 395], [1395, 985], [228, 1040]],
    items: [["win", 2700, 900, 1400, 1400], ["win", 5600, 900, 1400, 1400], ["door", 1000, 0, 900, 2100]], line: [4100, 5600, 1600] },
  s2F: { W: 7000, H: 3000, q: [[300, 420], [1330, 450], [1350, 1020], [280, 990]], items: [["win", 2900, 900, 1200, 1400]] },
  s3F: { W: 9000, H: 3000, gable: true, q: [[210, 430], [1390, 455], [1380, 1000], [225, 975]],
    items: [["win", 1500, 900, 1200, 1400], ["win", 6300, 900, 1200, 1400], ["door", 4000, 0, 900, 2100]] },
  s4F: { W: 7000, H: 3000, q: [[330, 450], [1290, 410], [1310, 1010], [310, 1035]], items: [["win", 3000, 1000, 1000, 1200]] },
};
function demoFacade(cfg) {
  const W = 1600, Hh = 1200, c = document.createElement("canvas"); c.width = W; c.height = Hh;
  const g = c.getContext("2d"), FW = cfg.W, FH = cfg.H;
  const M = homog([[0, FH], [FW, FH], [FW, 0], [0, 0]], cfg.q);
  const P = (x, y) => apply(M, [x, y]);
  const poly = (pts, fill, stroke, lw) => { g.beginPath(); pts.forEach((p, i) => { const q = P(p[0], p[1]); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }); g.closePath(); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 2; g.stroke(); } };
  const sky = g.createLinearGradient(0, 0, 0, Hh); sky.addColorStop(0, "#9DB9CF"); sky.addColorStop(.55, "#D8E3E8"); sky.addColorStop(.56, "#7F8C6A"); sky.addColorStop(1, "#5F6B4D");
  g.fillStyle = sky; g.fillRect(0, 0, W, Hh);
  if (cfg.gable) { poly([[-600, FH], [FW / 2, FH + 2100], [FW + 600, FH]], "#7B3F33", "#4E2620", 3); poly([[0, FH], [FW / 2, FH + 1850], [FW, FH]], "#E9E1D2", "#B9AE98", 2); }
  else poly([[-600, FH], [FW + 600, FH], [FW + 400, FH + 700], [-400, FH + 700]], "#7B3F33", "#4E2620", 3);
  poly([[0, FH], [FW, FH], [FW, 0], [0, 0]], "#E3DACA", "#A99D86", 2);
  poly([[0, 450], [FW, 450], [FW, 0], [0, 0]], "#8E8A80", null);
  for (const [t, x, y, w, h] of cfg.items) {
    if (t === "win") {
      poly([[x, y + h], [x + w, y + h], [x + w, y], [x, y]], "#F4F3EF", "#6C665B", 2);
      poly([[x + 70, y + h - 70], [x + w - 70, y + h - 70], [x + w - 70, y + 70], [x + 70, y + 70]], "#4D6475", null);
      poly([[x + w / 2 - 25, y + h - 70], [x + w / 2 + 25, y + h - 70], [x + w / 2 + 25, y + 70], [x + w / 2 - 25, y + 70]], "#F4F3EF", null);
      poly([[x - 60, y], [x + w + 60, y], [x + w + 60, y - 50], [x - 60, y - 50]], "#BDB6A8", null);
